# ReviewLens 基础设施编排
#
# 只管理基础设施容器（PostgreSQL / Elasticsearch / Redis / MinIO）。
# Python(Node) 服务使用本地环境（uv/conda），不在此编排。
#
# 用法：docker compose -f docker/docker-compose.yml up -d
#
# 依赖镜像：
#   pgvector/pgvector:pg16      本地已有
#   redis:7.2                   本地已有
#   minio/minio:RELEASE.2025-06 本地已有
#   elasticsearch:8.15.0        需拉取（docker/elasticsearch 构建时安装 IK 分词器）

name: reviewlens

services:
  # ---------- 数据库组 ----------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: reviewlens-postgres
    restart: unless-stopped
    ports:
      - "15432:5432"   # 宿主机用 15432，避开 Windows Hyper-V 动态保留段 5355-5454
    environment:
      POSTGRES_DB: reviewlens
      POSTGRES_USER: reviewlens
      POSTGRES_PASSWORD: "${DB_PASSWORD:-reviewlens_dev_only}"
    volumes:
      - reviewlens_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewlens -d reviewlens"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- 搜索引擎组 ----------
  # 从 docker/elasticsearch/Dockerfile 构建，构建时自动下载安装 IK 分词器
  elasticsearch:
    build:
      context: ./elasticsearch
      args:
        IK_VERSION: "${IK_VERSION:-8.15.0}"
    image: reviewlens/elasticsearch:8.15.0
    container_name: reviewlens-elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - reviewlens_esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  # ---------- 缓存 / 队列 ----------
  redis:
    image: redis:7.2
    container_name: reviewlens-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - reviewlens_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------- 对象存储 ----------
  minio:
    image: minio/minio:RELEASE.2025-06-13T11-33-47Z-cpuv1
    container_name: reviewlens-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web 控制台
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-reviewlens_admin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-reviewlens_minio_dev_only}"
    volumes:
      - reviewlens_miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  reviewlens_pgdata:
  reviewlens_esdata:
  reviewlens_miniodata:
  reviewlens_redisdata:

networks:
  default:
    name: reviewlens-net